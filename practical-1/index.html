<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Voting System</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <h1>Vote Your Favorite Language</h1>
      <div class="poll">
        <button class="vote-btn" onclick="vote('JavaScript')">
          JavaScript
        </button>
        <button class="vote-btn" onclick="vote('Python')">Python</button>
        <button class="vote-btn" onclick="vote('Java')">Java</button>
        <button class="vote-btn" onclick="vote('C++')">C++</button>
      </div>
      <div class="results">
        <div class="result-row">
          <span>JavaScript</span>
          <span class="votes" id="votes-JavaScript">0</span>
        </div>
        <div class="result-row">
          <span>Python</span>
          <span class="votes" id="votes-Python">0</span>
        </div>
        <div class="result-row">
          <span>Java</span>
          <span class="votes" id="votes-Java">0</span>
        </div>
        <div class="result-row">
          <span>C++</span>
          <span class="votes" id="votes-C++">0</span>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
